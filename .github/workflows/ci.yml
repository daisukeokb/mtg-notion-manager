name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check. Layer B (Phase 3H-R1): every test suite that executes
  # repository code runs inside a container with no network (only loopback),
  # no production secrets, a read-only root filesystem and an unprivileged
  # user. There is no non-isolated pytest path in this workflow.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Run test suites in the network-isolated container
        run: bash scripts/run_isolated_tests.sh
      - name: Red checks (isolation must fail closed)
        run: bash scripts/check_isolation_red.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src

  generation-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e tools/generation_workspace
      # Everything that executes repository code runs inside the network-less
      # container (Layer B, scripts/run_isolated_tests.sh); only the static
      # checks (ruff, mypy) run directly on the runner.
      - name: Run generation workspace pytest (isolated)
        run: bash scripts/run_isolated_tests.sh pytest tools/generation_workspace/tests
      - name: Report generation workspace pytest collection count (isolated)
        run: bash scripts/run_isolated_tests.sh pytest tools/generation_workspace/tests --collect-only -q
      - name: Run ruff on generation workspace
        run: ruff check tools/generation_workspace
      - name: Run mypy on generation workspace
        run: mypy tools/generation_workspace/generation_workspace
      - name: Verify official console CLI (isolated)
        run: bash scripts/run_isolated_tests.sh generation-workspace --help
      - name: Verify official module CLI (isolated)
        run: bash scripts/run_isolated_tests.sh python -m generation_workspace --help
